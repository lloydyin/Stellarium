name: Build for Android CMake

on:
  push:
    tags:
      - v*
    branches:
      - CICD*
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04
    if: "!contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]')"
    
    steps:
    - name: Fetch OpenSSL
      run: |
        git clone --depth 1 https://github.com/KDAB/android_openssl.git ../android_openssl
    - uses: actions/checkout@v4
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'
    # - name: Checkout submodules
    #   uses: srt32/git-actions@v0.0.3
    #   with:
    #     args: git submodule update --init --recursive
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        target: 'android'
        version: '5.15.1'
        modules: 'qtscript'
        cache: 'true'
        cache-key-prefix: ${{ runner.os }}-QtCache
    - name: Install Additional Software
      run: |
        set -o pipefail
        {
          wget -q https://dl.google.com/android/repository/android-ndk-r21-linux-x86_64.zip
          sudo unzip -q android-ndk-r21-linux-x86_64.zip -d $ANDROID_SDK_ROOT
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            find "$ANDROID_SDK_ROOT" -name sdkmanager -type f || true
            exit 1
          fi
          SDKMANAGER_JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          env JAVA_HOME="$SDKMANAGER_JAVA_HOME" "$SDKMANAGER" --version
          set +o pipefail
          yes | env JAVA_HOME="$SDKMANAGER_JAVA_HOME" "$SDKMANAGER" --licenses
          sdkmanager_status="${PIPESTATUS[1]}"
          set -o pipefail
          if [ "$sdkmanager_status" -ne 0 ]; then
            exit "$sdkmanager_status"
          fi
          set +o pipefail
          yes | env JAVA_HOME="$SDKMANAGER_JAVA_HOME" "$SDKMANAGER" --install "platforms;android-30"
          sdkmanager_status="${PIPESTATUS[1]}"
          set -o pipefail
          if [ "$sdkmanager_status" -ne 0 ]; then
            exit "$sdkmanager_status"
          fi
        } 2>&1 | tee setup.log
    - name: Configure
      run: |
        cmake . \
          -DANDROID_ABI:STRING=arm64-v8a \
          -DANDROID_BUILD_ABI_arm64-v8a:BOOL=ON \
          -DANDROID_BUILD_ABI_armeabi-v7a:BOOL=OFF \
          -DANDROID_BUILD_ABI_x86:BOOL=OFF \
          -DANDROID_BUILD_ABI_x86_64:BOOL=OFF \
          -DANDROID_NATIVE_API_LEVEL:STRING=21 \
          -DANDROID_NDK:PATH=$ANDROID_SDK_ROOT/android-ndk-r21 \
          -DANDROID_SDK:PATH=$ANDROID_SDK_ROOT \
          -DANDROID_STL:STRING=c++_shared \
          -DCMAKE_BUILD_TYPE:STRING=Release \
          -DCMAKE_CXX_COMPILER:STRING=$ANDROID_SDK_ROOT/android-ndk-r21/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++ \
          -DCMAKE_C_COMPILER:STRING=$ANDROID_SDK_ROOT/android-ndk-r21/toolchains/llvm/prebuilt/linux-x86_64/bin/clang \
          -DCMAKE_FIND_ROOT_PATH:STRING=$Qt5_DIR \
          -DCMAKE_INSTALL_PREFIX:STRING=android-build/assets \
          -DCMAKE_PREFIX_PATH:STRING=$Qt5_DIR \
          -DCMAKE_TOOLCHAIN_FILE:PATH=$ANDROID_SDK_ROOT/android-ndk-r21/build/cmake/android.toolchain.cmake \
          -DQT_QMAKE_EXECUTABLE:STRING=$Qt5_DIR/bin/qmake
    - name: Compile
      run: |
        set -o pipefail
        {
          pwd
          make VERBOSE=1
          OPENSSL_LIB_DIR=../android_openssl/ssl_1.1/arm64-v8a
          test -f "$OPENSSL_LIB_DIR/libcrypto_1_1.so"
          test -f "$OPENSSL_LIB_DIR/libssl_1_1.so"
          mkdir -p android-build/libs/arm64-v8a
          cp "$OPENSSL_LIB_DIR/libcrypto_1_1.so" "$OPENSSL_LIB_DIR/libssl_1_1.so" android-build/libs/arm64-v8a/
          make install
          ANDROIDDEPLOYQT="$(command -v androiddeployqt || true)"
          if [ -z "$ANDROIDDEPLOYQT" ] && [ -x "$Qt5_DIR/bin/androiddeployqt" ]; then
            ANDROIDDEPLOYQT="$Qt5_DIR/bin/androiddeployqt"
          fi
          if [ -z "$ANDROIDDEPLOYQT" ] && [ -x "$Qt5_DIR/../../bin/androiddeployqt" ]; then
            ANDROIDDEPLOYQT="$Qt5_DIR/../../bin/androiddeployqt"
          fi
          if [ -z "$ANDROIDDEPLOYQT" ]; then
            echo "androiddeployqt not found; Qt5_DIR=$Qt5_DIR"
            find "$(dirname "$(dirname "$Qt5_DIR")")" -name androiddeployqt -type f || true
            exit 1
          fi
          "$ANDROIDDEPLOYQT" --input android_deployment_settings.json --output android-build --android-platform android-30 --gradle --verbose
        } 2>&1 | tee build.log
    - name: show filetrees
      if: always()
      run: |
        ls -R | tee filetrees.log
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Stellarium-Android-arm64-v8a
        path: |
          setup.log
          build.log
          filetrees.log
          android-build/*.apk
          android-build/build/outputs/apk/**/*.apk
        if-no-files-found: warn
